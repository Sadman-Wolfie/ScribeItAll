<!DOCTYPE html>
<html>
<head>
  <title>ScribeItAll - Grimoire Settings</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #f0f0f0; padding: 30px; }
    .container { max-width: 500px; margin: 0 auto; background: #2d2d2d; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h1 { margin-top: 0; color: #d4d4d4; font-size: 24px; border-bottom: 1px solid #444; padding-bottom: 10px; }
    label { display: block; margin: 15px 0 5px; font-weight: bold; }
    select { width: 100%; padding: 10px; background: #1e1e1e; color: #fff; border: 1px solid #555; border-radius: 4px; font-size: 16px; margin-bottom: 20px; }
    button { background: #5a0000; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #8b0000; }
    #status { margin-left: 15px; color: #4caf50; font-size: 14px; opacity: 0; transition: opacity 0.3s; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Transmutation Settings</h1>
    
    <label for="theme">Select Ritual Circle Theme:</label>
    <select id="theme">
      <option value="blood">The Blood Pact (Scarlet Core)</option>
      <option value="verdant">The Overgrowth (Nature/Leaf Elements)</option>
      <option value="cyber">The Neon Matrix (Cyber Grid)</option>
    </select>

    <div>
      <button id="save">Save Binding</button>
      <span id="status">Settings saved!</span>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
